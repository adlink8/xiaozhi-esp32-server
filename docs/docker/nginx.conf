user  root;
worker_processes  4;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  300;
    client_header_timeout 180s;
    client_body_timeout 180s;
    client_max_body_size 1024M;

    gzip on;
    gzip_buffers 32 4K;
    gzip_comp_level 6;
    gzip_min_length 100;
    gzip_types application/javascript text/css text/xml image/jpeg image/gif image/png;
    gzip_disable "MSIE [1-6]\.";
    gzip_vary on;

    server {
        server_name localhost;
        listen  8002;

        location / {
			root /usr/share/nginx/html;
			try_files $uri $uri/ /index.html;
		}

        # OTA 接口 - 不带/xiaozhi 前缀（ESP32 设备使用）
        location /ota/ {
            proxy_pass http://127.0.0.1:8003/ota/;
            proxy_set_header   Host   $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            proxy_read_timeout 300;
        }

        # OTA 下载接口 - 不带/xiaozhi 前缀（ESP32 设备和智控台使用）
        location /otaMag/ {
            proxy_pass http://127.0.0.1:8003/otaMag/;
            proxy_set_header   Host   $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            proxy_read_timeout 300;

            # 禁用 gzip 压缩（二进制文件）
            gzip off;

            # 优化大文件传输
            proxy_buffering off;
            proxy_cache off;
        }

        # OTA 下载接口 - 带/xiaozhi 前缀（智控台使用）
        location /xiaozhi/otaMag/ {
            proxy_pass http://127.0.0.1:8003/otaMag/;
            proxy_set_header   Host   $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            proxy_read_timeout 300;

            # 禁用 gzip 压缩（二进制文件）
            gzip off;

            # 优化大文件传输
            proxy_buffering off;
            proxy_cache off;
        }

        # 其他/xiaozhi 接口 - 剥离前缀
        location /xiaozhi/ {
            proxy_pass http://127.0.0.1:8003/;
            proxy_set_header   Host   $host;
            proxy_cookie_path /manager/ /;
            proxy_set_header   Referer $http_referer;
            proxy_set_header   Cookie $http_cookie;
            proxy_connect_timeout 15;
            proxy_send_timeout 15;
            proxy_read_timeout 15;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
